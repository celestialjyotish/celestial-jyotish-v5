version: "5.0"

title: "Celestial Jyotish V5 — Voice Bible"

purpose:
  description: >
    Permanent voice and narration specification for Celestial Jyotish V5.
    Voice identity should remain consistent across episodes while allowing
    delivery to adapt to the emotional requirements of each scene.

principles:

  voice_is_character:
    rule: >
      Voice is part of character identity. Do not randomly change vocal
      identity, gender, register, cadence or emotional character between
      episodes.

  natural_delivery:
    rule: >
      Delivery must sound conversational, intelligent, controlled and
      human rather than like an announcer reading a script.

  technical_delivery:
    rule: >
      Technical astrology must be pronounced clearly without becoming
      artificially academic.

  emotional_delivery:
    rule: >
      Emotion should change according to the scene. The underlying vocal
      identity remains stable.

language:
  primary: "Hindi"
  secondary: "English"
  target_mix: "Approximately 70% Hindi / 30% English"

  pronunciation:
    rule: >
      Hindi should sound natural and conversational. English technical
      terms should retain clear English pronunciation when they are intended
      to be spoken in English.

dev:

  identity:
    role: "Primary male voice"
    gender: "Male"
    character: "Dev"

  established_profile:
    register: "Low baritone"
    approximate_frequency_range: "85Hz-110Hz"
    resonance: "Deep chest resonance"
    speaking_rate: "Approximately 130 WPM"
    stability: "65%"

  delivery:
    baseline:
      - "Authoritative"
      - "Scholarly"
      - "Controlled"
      - "Unhurried"
      - "Confident"
      - "Warm when emotionally appropriate"

    avoid:
      - "Shouting"
      - "Artificially dramatic narration"
      - "Overly theatrical delivery"
      - "Rushed speech"
      - "Monotone lecture delivery"
      - "Aggressive delivery without story justification"

  emotional_modes:

    sovereign:
      tone: "Calm authority"
      use_for:
        - "Final insights"
        - "Major astrological revelations"
        - "High-confidence statements"

    focused:
      tone: "Controlled concentration"
      use_for:
        - "Technical explanation"
        - "Research"
        - "Analysis"

    restrained:
      tone: "Quiet intensity"
      use_for:
        - "Conflict"
        - "Anger under control"
        - "Emotional tension"

    warm:
      tone: "Grounded warmth"
      use_for:
        - "Repair"
        - "Connection"
        - "Support"
        - "Human moments"

asha:

  identity:
    role: "Primary female voice"
    gender: "Female"
    character: "Asha"

  established_profile:
    register: "Warm mezzo-soprano"
    approximate_frequency_range: "185Hz-210Hz"
    air_ratio: "Approximately 10-15% intimate vocal air"
    speaking_rate: "Approximately 120 WPM"
    stability: "55%"

  delivery:
    baseline:
      - "Silky"
      - "Hypnotic"
      - "Authoritative"
      - "Professional"
      - "Conversational"
      - "Measured"
      - "Natural"

    avoid:
      - "Overly breathy delivery"
      - "Childlike tone"
      - "Artificial seduction"
      - "Excessive whispering"
      - "Shouting"
      - "Theatrical melodrama"

  emotional_modes:

    scholarly:
      tone: "Calm intellectual authority"
      use_for:
        - "Technical Jyotish"
        - "Research"
        - "Astrological explanation"

    mysterious:
      tone: "Quiet intrigue"
      use_for:
        - "Hidden patterns"
        - "Occult subjects"
        - "Revelations"

    warm:
      tone: "Soft emotional confidence"
      use_for:
        - "Relationship scenes"
        - "Repair"
        - "Human moments"

    commanding:
      tone: "Controlled authority"
      use_for:
        - "Major revelations"
        - "Important conclusions"
        - "Direct audience address"

narration_architecture:

  default_mode: "Mixed Mode"

  background_narration:
    rule: >
      When narration describes physical action, the on-screen character
      normally keeps lips closed.

    purpose:
      - "Preserve visual storytelling"
      - "Avoid unnecessary lip-sync"
      - "Allow cinematic physical action"
      - "Maintain production stability"

  on_screen_lip_sync:
    rule: >
      Actual visible character speech should use lip synchronization.

    transition:
      principle: >
        A character may begin with background narration while performing an
        action, then turn toward the camera and transition into visible
        speech for an important line.

  rule:
    description: >
      Narration should not force every scene into talking-head behavior.

    priority:
      - "Physical action"
      - "Narration"
      - "Lip-sync only when visually justified"

delivery_timing:

  general:
    rule: >
      Dialogue must fit the actual generated clip duration. Never solve
      timing problems by simply instructing the voice to speak unrealistically
      slowly.

  dev:
    baseline_wpm: 130

  asha:
    baseline_wpm: 120

  adjustment:
    allowed: true
    rule: >
      Minor pacing adjustments are permitted when required by emotional
      delivery, pronunciation, pauses or scene duration.

  priority:
    - "Natural delivery"
    - "Clarity"
    - "Emotional authenticity"
    - "Duration compliance"

pause_design:

  purpose:
    - "Create anticipation"
    - "Separate technical concepts"
    - "Allow visual action to land"
    - "Increase emotional weight"

  rule: >
    Pauses should have narrative purpose. Do not insert pauses mechanically
    into every sentence.

technical_astrology_pronunciation:

  rule: >
    Classical and technical terminology should be pronounced clearly and
    consistently.

  examples:
    Jyotish:
      pronunciation_note: "Natural scholarly Hindi pronunciation"

    English_terms:
      rule: >
        Technical English words embedded in Hindi should normally retain
        clear English pronunciation.

    mixed_language:
      rule: >
        Do not force English technical terminology into awkward Hindi
        phonetics merely to increase linguistic purity.

script_to_voice_rules:

  narration:
    rule: >
      Narration should sound like an intelligent person explaining something
      meaningful, not like an AI reading a paragraph.

  dialogue:
    rule: >
      Dialogue should reflect the character's immediate emotional situation.

  technical_explanation:
    rule: >
      Technical material should remain precise while being delivered in
      naturally spoken sentences.

  emotional_line:
    rule: >
      Emotional lines should be allowed breathing room and should not be
      compressed merely to maximize information density.

  final_line:
    rule: >
      The final line should normally have enough space to land emotionally.

audio_direction:

  voice:
    rule: >
      Maintain stable character voice identity across scenes.

  background_narration:
    rule: >
      Character lips remain closed when the character is not visibly
      speaking.

  lip_sync:
    rule: >
      Only the intended speaker should visibly articulate the spoken line.

  multi_character:
    rule: >
      When multiple characters are present, explicitly identify the speaker
      whenever voice ambiguity could occur.

  sfx:
    rule: >
      Sound effects should support physical action without overpowering
      narration.

  music:
    rule: >
      Music should support emotional progression and should not compete with
      spoken words.

  silence:
    rule: >
      Silence may be deliberately used before important revelations,
      decisions and emotional resolution.

quality_control:

  voice_identity:
    check:
      - "Does the voice sound like the established character?"
      - "Is the register consistent?"
      - "Is the gender consistent?"
      - "Is the pacing natural?"

  pronunciation:
    check:
      - "Are Hindi words naturally pronounced?"
      - "Are English technical terms clear?"
      - "Are important Jyotish terms intelligible?"

  emotional:
    check:
      - "Does the tone match the scene?"
      - "Is the delivery controlled?"
      - "Is the emotional change believable?"

  synchronization:
    check:
      - "Are lips closed during background narration?"
      - "Is only the intended speaker lip-synced?"
      - "Does lip-sync begin at the intended point?"

  duration:
    check:
      - "Does the dialogue fit the clip?"
      - "Does the speaker sound natural rather than rushed?"
      - "Are pauses meaningful?"

forbidden_voice_drift:

  avoid:
    - "Randomly changing Dev's vocal register"
    - "Randomly changing Asha's vocal register"
    - "Switching character gender"
    - "Turning Dev into a shouting action hero"
    - "Turning Asha into an exaggerated seductive narrator"
    - "Artificially slowing dialogue to fit oversized scripts"
    - "Narrating every scene as a talking head"
    - "Lip-syncing a character who is supposed to remain silent"
    - "Allowing background music to overpower narration"

final_standard:

  statement: >
    Celestial Jyotish voice should sound intelligent, cinematic, human and
    trustworthy. The voice exists to carry the story and astrology, not to
    announce them mechanically.
